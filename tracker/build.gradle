plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

// Load GitHub properties file
def githubProperties = new Properties()
githubProperties.load(new FileInputStream(rootProject.file("github.properties")))

/** Function to retrieve version name
 * First part is the base version from toni-kustiana/tracker
 * Second part is this library's version
 */
def getVersionName = { ->
    return "2.3.20-1" // Replace with version name
}

// Function to retrieve artifact ID
def getMyArtifactId = { ->
    return "tracker" // Replace with library name ID
}

afterEvaluate {
    publishing {
        publications {
            bar(MavenPublication) {
                groupId = "id.co.edtslib" // Replace with group ID
                artifactId = getMyArtifactId()
                version = getVersionName()
                artifact("$buildDir/outputs/aar/${getMyArtifactId()}-release.aar")
            }
        }

        repositories {
            maven {
                name = "GitHubPackages"
                // Configure the URL of your package repository on GitHub
                url = uri("https://maven.pkg.github.com/Dhanfinix/tracker") // Replace with GitHub details

                credentials {
                    // Use GitHub properties or environment variables for credentials
                    username = githubProperties['USER_ID'] ?: System.getenv("USER_ID")
                    password = githubProperties['ACCESS_TOKEN'] ?: System.getenv("ACCESS_TOKEN")
                }
            }
        }
    }
}

android {
    namespace 'id.co.edtslib.tracker'
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        buildConfigField("String", "DB_PASS", "\"${db_pass_phrase}\"")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.6.1'
    implementation "androidx.preference:preference-ktx:1.2.0"

    //koin
    implementation "io.insert-koin:koin-core:4.1.1"
    implementation "io.insert-koin:koin-android:4.1.1"

    //lifecycle
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.5.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1"

    // Networking
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:okhttp:5.3.0"
    implementation "com.squareup.okhttp3:logging-interceptor:5.3.0"
    implementation "com.facebook.stetho:stetho:1.6.0"
    implementation "com.facebook.stetho:stetho-okhttp3:1.6.0"

    /* security */
    implementation "androidx.security:security-crypto-ktx:1.1.0-alpha03"
    implementation "com.scottyab:secure-preferences-lib:0.1.7"

    /* coroutines */
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"

    implementation "com.android.installreferrer:installreferrer:2.2"

    implementation("com.github.edtslib:baserecyclerview2:1.1.0")
    implementation("com.github.edtslib:baserecyclerview:1.2.0")

    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}